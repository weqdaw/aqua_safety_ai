<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>黄村乡AI防溺水智能管理系统 - 登录与注册</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: rgba(15, 23, 42, 0.6);
            --input-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Glow Blobs */
        .glow-blob {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(37, 99, 235, 0.15) 0%, rgba(37, 99, 235, 0) 70%);
            z-index: 0;
            filter: blur(40px);
            animation: float 10s ease-in-out infinite alternate;
        }
        .glow-blob-1 { top: -100px; left: -100px; }
        .glow-blob-2 { bottom: -100px; right: -100px; background: radial-gradient(circle, rgba(14, 165, 233, 0.15) 0%, rgba(14, 165, 233, 0) 70%); }

        @keyframes float {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(20px) scale(1.1); }
        }

        /* Card Wrapper */
        .card-container {
            width: 420px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 40px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            z-index: 10;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            background: linear-gradient(to right, #38bdf8, #2563eb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: var(--text-muted);
            font-size: 14px;
        }

        /* Toggle tabs */
        .tabs {
            display: flex;
            background: var(--input-bg);
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 25px;
            border: 1px solid var(--input-border);
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--primary);
            color: var(--text-main);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
        }

        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        /* Role Selector Custom Style */
        select.form-control {
            appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg fill='%2394a3b8' height='24' viewBox='0 0 24 24' width='24' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/><path d='M0 0h24v24H0z' fill='none'/></svg>");
            background-repeat: no-repeat;
            background-position: right 12px center;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            border: none;
            border-radius: 10px;
            color: var(--text-main);
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-submit:active {
            transform: translateY(1px);
        }

        /* Message toast */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid var(--primary);
            color: var(--text-main);
            padding: 12px 24px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            z-index: 100;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
            transform: translateY(-20px);
            opacity: 0;
            transition: all 0.3s;
            pointer-events: none;
            font-size: 14px;
        }
        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
        .toast.error {
            border-color: #ef4444;
        }
        .toast.success {
            border-color: #10b981;
        }

        /* Utility classes */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="glow-blob glow-blob-1"></div>
    <div class="glow-blob glow-blob-2"></div>

    <div class="card-container" id="loginCard">
        <div class="header">
            <h1>黄村乡 AI 防溺水系统</h1>
            <p id="subheadingText">后台决策与联动指挥中心</p>
        </div>

        <div class="tabs">
            <button class="tab-btn active" id="tabLogin" onclick="switchTab('login')">用户登录</button>
            <button class="tab-btn" id="tabRegister" onclick="switchTab('register')">新客注册</button>
        </div>

        <!-- LOGIN FORM -->
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="loginUser">账户账号</label>
                <input type="text" id="loginUser" class="form-control" placeholder="请输入用户名" required>
            </div>
            <div class="form-group">
                <label for="loginPwd">登录密码</label>
                <input type="password" id="loginPwd" class="form-control" placeholder="请输入登录密码" required>
            </div>
            <button type="submit" class="btn-submit">立即登录</button>
        </form>

        <!-- REGISTER FORM -->
        <form id="registerForm" class="hidden" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label for="regUser">账号名称</label>
                <input type="text" id="regUser" class="form-control" placeholder="用于系统登录" required>
            </div>
            <div class="form-group">
                <label for="regPwd">安全密码</label>
                <input type="password" id="regPwd" class="form-control" placeholder="长度不小于6位" required>
            </div>
            <div class="form-group">
                <label for="regName">真实姓名</label>
                <input type="text" id="regName" class="form-control" placeholder="方便值班室联络" required>
            </div>
            <div class="form-group">
                <label for="regPhone">手机号码</label>
                <input type="tel" id="regPhone" class="form-control" placeholder="接收出警短信及拨打电话">
            </div>
            <div class="form-group">
                <label for="regRole">注册系统角色</label>
                <select id="regRole" class="form-control" required>
                    <option value="ROLE_OPERATOR">监控值守员 (Operator)</option>
                    <option value="ROLE_RESCUER">现场救生员 (Lifeguard)</option>
                    <option value="ROLE_LEADER">乡镇级领导 (Leader)</option>
                    <option value="ROLE_ADMIN">系统运维管理员 (Admin)</option>
                </select>
            </div>
            <button type="submit" class="btn-submit">提交注册</button>
        </form>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast">操作成功</div>

    <script>
        // Check if token exists, redirect to dashboard if logged in
        if (localStorage.getItem('token')) {
            window.location.href = 'dashboard.html';
        }

        const toastEl = document.getElementById('toast');
        function showToast(message, type = 'success') {
            toastEl.innerText = message;
            toastEl.className = `toast show ${type}`;
            setTimeout(() => {
                toastEl.classList.remove('show');
            }, 3000);
        }

        function switchTab(mode) {
            document.getElementById('tabLogin').classList.toggle('active', mode === 'login');
            document.getElementById('tabRegister').classList.toggle('active', mode === 'register');
            document.getElementById('loginForm').classList.toggle('hidden', mode === 'register');
            document.getElementById('registerForm').classList.toggle('hidden', mode === 'login');
            document.getElementById('subheadingText').innerText = 
                mode === 'login' ? '后台决策与联动指挥中心' : '注册为防溺水安全应急责任人';
        }

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('loginUser').value.trim();
            const password = document.getElementById('loginPwd').value;

            try {
                const response = await fetch('/api/v1/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const result = await response.json();
                if (result.code === 200) {
                    showToast('登录成功，正在进入大屏控制台...', 'success');
                    localStorage.setItem('token', result.data.token);
                    localStorage.setItem('tokenHead', result.data.tokenHead);
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                } else {
                    showToast(result.message || '登录失败，请核对账号与密码', 'error');
                }
            } catch (err) {
                console.error(err);
                showToast('服务器连接异常，请检查网络或后端运行状态', 'error');
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const username = document.getElementById('regUser').value.trim();
            const password = document.getElementById('regPwd').value;
            const realName = document.getElementById('regName').value.trim();
            const phone = document.getElementById('regPhone').value.trim();
            const roleCode = document.getElementById('regRole').value;

            try {
                const response = await fetch('/api/v1/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, realName, phone, roleCode })
                });

                const result = await response.json();
                if (result.code === 200) {
                    showToast('注册成功！正在切换至登录面...', 'success');
                    setTimeout(() => {
                        switchTab('login');
                        document.getElementById('loginUser').value = username;
                        document.getElementById('loginPwd').value = '';
                    }, 1500);
                } else {
                    showToast(result.message || '注册失败，用户名可能已存在', 'error');
                }
            } catch (err) {
                console.error(err);
                showToast('服务器连接异常，请检查网络或后端运行状态', 'error');
            }
        }
    </script>
</body>
</html>
