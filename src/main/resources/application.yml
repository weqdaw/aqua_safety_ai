server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: hc-drown-platform
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/hc_drown?currentSchema=public}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: false
    encoding: UTF-8

  data:
    redis:
      host: localhost
      port: 6379
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2
          max-wait: -1ms

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
    consumer:
      group-id: hc-drown-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "com.hc.drown.*"
    listener:
      ack-mode: manual_immediate
      auto-startup: false

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: assign_id
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  info:
    title: 黄村乡AI防溺水智能管理平台 API
    description: 防溺水智能管理系统后端接口文档
    version: v1.0.0

# JWT 配置
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 7200    # 2小时，单位秒
  refresh-token-expiration: 604800 # 7天，单位秒

# 系统配置
hc:
  drown:
    kafka:
      topics:
        alert-event: hc.alert.event
        alert-confirmed: hc.alert.confirmed
        rescue-task: hc.rescue.task
        device-status: hc.device.status
        drone-command: hc.drone.command
        location-update: hc.location.update
    # 人员调度配置
    dispatch:
      max-rescuer-count: 3          # 单事件最大派遣人数
      task-timeout-minutes: 10      # 任务接受超时时间（分钟）
    # 存储配置
    storage:
      alert-video-retention-days: 90
      inspection-report-retention-days: 365
    # 监控分发与AI算法集成配置
    distribution:
      url: ${DISTRIBUTION_URL:http://127.0.0.1:8000}
      token: ${DISTRIBUTION_API_TOKEN}

logging:
  level:
    com.hc.drown: DEBUG
    org.springframework.security: INFO
    org.springframework.kafka: ERROR
    org.apache.kafka: ERROR
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
